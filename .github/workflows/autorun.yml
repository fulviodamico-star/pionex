name: Pionex Fast-Scalp AI Bot

on:
  schedule:
    # 1. MASSIMA LIQUIDITA' MONDIALE: Wall Street + ETF USA + Overlap Londra/NY + Macro USD (12:00 - 21:59 UTC) -> Ogni 15 min
    - cron: '2,17,32,47 12-21 * * *'

    # 2. CHIUSURA CANDELA GIORNALIERA (00:00 UTC) + APERTURA ASIA/TOKYO + FUNDING 00:00 UTC (00:00 - 02:59 UTC) -> Ogni 30 min
    - cron: '2,32 0-2 * * *'

    # 3. APERTURA LONDRA/EUROPA + FUNDING 08:00 UTC (07:00 - 11:59 UTC) -> Ogni 30 min
    - cron: '2,32 7-11 * * *'

    # 4. DEAD ZONE GLOBALE 1: Pausa Asiatica (03:00 - 06:59 UTC) -> Ogni 60 min
    - cron: '7 3-6 * * *'

    # 5. DEAD ZONE GLOBALE 2: Post-Chiusura Wall Street (22:00 - 23:59 UTC) -> Ogni 60 min
    - cron: '7 22-23 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Pionex AI Fast-Scalp Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN || secrets.TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.TELEGRAM_CHAT }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY || secrets.API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET || secrets.API_SECRET }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py

      - name: Save Bot State & Live Console (Auto-Commit)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bot_state.json index.html
          git diff --staged --quiet || (git commit -m "chore: update fast-scalp state and live console" && git pull --rebase -X theirs origin ${{ github.ref_name }} && git push)
