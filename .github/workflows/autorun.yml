name: Pionex Neural Quant Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN || secrets.TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.TELEGRAM_CHAT }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET }}
          LIVE_TRADING: ${{ secrets.LIVE_TRADING }}
        run: python main.py

      - name: Salva Stato Bot e Dashboard nel Repository
        run: |
          git config --global user.name "NeuralGridBot"
          git config --global user.email "bot@noreply.github.com"
          git add bot_state.json index.html || true
          git diff --staged --quiet || git commit -m "Aggiornamento Dashboard e Stato Bot [skip ci]"
          git push
