name: Pionex FreqAI v10 Autonomous Bot

on:
  repository_dispatch:
    types: [tick]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Comando manuale (status | close | sell_all | open)'
        required: false
        default: 'status'
      coin:
        description: 'Codice coin (es. SOL, BTC, ETH) per open / sell_all'
        required: false
        default: ''
      amount_usdt:
        description: 'Importo USDT per open manuale (0 = calcolo automatico)'
        required: false
        default: '0'

concurrency:
  group: pionex-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze (FreqAI + Scikit-Learn + Pandas)
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary "requests>=2.32.5,<3" "pandas>=2.2.0" "scikit-learn>=1.4.0"

      - name: Configura Git per aggiornamenti live della Web Console
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Esegui Pionex FreqAI v10 Engine (24/7 Continuous Guardian)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          INVEST_EUR: ${{ vars.INVEST_EUR || '50' }}
          AUTO_TRADE_ENABLED: ${{ vars.AUTO_TRADE_ENABLED || 'false' }}
          ALWAYS_ON_24_7: ${{ vars.ALWAYS_ON_24_7 || 'true' }}
          GUARDIAN_MINUTES_OPEN: ${{ vars.GUARDIAN_MINUTES_OPEN || '18' }}
          GUARDIAN_TICK_SEC: ${{ vars.GUARDIAN_TICK_SEC || '15' }}
          GUARDIAN_RESCAN_SEC: ${{ vars.GUARDIAN_RESCAN_SEC || '300' }}
          TELEGRAM_ROUTINE_MIN: ${{ vars.TELEGRAM_ROUTINE_MIN || '30' }}
          MANUAL_COMMAND: ${{ github.event.inputs.command || '' }}
          MANUAL_COIN: ${{ github.event.inputs.coin || '' }}
          MANUAL_USDT: ${{ github.event.inputs.amount_usdt || '0' }}
        run: python3 main.py

      - name: Salva stato finale (bot_state.json) e Web Console (index.html)
        run: |
          git add bot_state.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update bot state & web console [skip ci]"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
