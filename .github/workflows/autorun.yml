name: Pionex Neural Quant Grid Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Neural Bot & Build WebApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTIVE_LOWER: ${{ secrets.ACTIVE_LOWER }}
          ACTIVE_UPPER: ${{ secrets.ACTIVE_UPPER }}
          AUTO_TRADE_ENABLED: "false"
          PIONEX_WEBHOOK_URL: ${{ secrets.PIONEX_WEBHOOK_URL }}
          PIONEX_SIGNAL_TOKEN: ${{ secrets.PIONEX_SIGNAL_TOKEN }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET }}
        run: python main.py

      - name: Save Bot State & WebApp Dashboard
        run: |
          git config --global user.name "NeuralGridBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add bot_state.json index.html || true
          git diff --staged --quiet || (git commit -m "Aggiornamento Dashboard e Stato Bot [skip ci]" && git pull --rebase && git push)
