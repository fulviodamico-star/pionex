name: AI Grid Advisor Autonomous

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'  # Esegue il controllo ogni 15 minuti per reagire subito agli Stop Loss!

permissions:
  contents: write  # <--- FONDAMENTALE: Permette al bot di salvare la memoria (bot_state.json)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Avvia il Bot Autonomo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_TRADE_ENABLED: "true"
          PIONEX_WEBHOOK_URL: ${{ secrets.PIONEX_WEBHOOK_URL }}
          PIONEX_SIGNAL_TOKEN: ${{ secrets.PIONEX_SIGNAL_TOKEN }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET }}
        run: python main.py

      - name: Salva Memoria del Bot (bot_state.json)
        run: |
          git config --global user.name "TradingBot"
          git config --global user.email "bot@github.com"
          git add bot_state.json || true
          git diff --staged --quiet || git commit -m "Aggiornamento stato bot automatico"
          git push
