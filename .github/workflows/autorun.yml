name: Neural Quant Grid Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Avvia Neural Quant Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTIVE_LOWER: ${{ vars.ACTIVE_LOWER }}
          ACTIVE_UPPER: ${{ vars.ACTIVE_UPPER }}
          AUTO_TRADE_ENABLED: "false"
          PIONEX_WEBHOOK_URL: ${{ secrets.PIONEX_WEBHOOK_URL }}
          PIONEX_SIGNAL_TOKEN: ${{ secrets.PIONEX_SIGNAL_TOKEN }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET }}
        run: python main.py

      - name: Salva Memoria Autonoma (bot_state.json)
        run: |
          if [ -f bot_state.json ]; then
            git config --global user.name "NeuralGridBot"
            git config --global user.email "bot@users.noreply.github.com"
            git add bot_state.json
            git diff --staged --quiet || (git commit -m "Aggiornamento memoria bot_state.json [skip ci]" && git pull --rebase && git push)
          fi
