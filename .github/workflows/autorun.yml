name: Pionex Fast-Scalp AI Bot

on:
  schedule:
    # 🔥 CORE US SESSION: Wall Street + ETF + overlap Londra/NY + macro USD (13:00-20:59 UTC) -> ogni 15 min
    - cron: '2,17,32,47 13-20 * * *'
    # Pre-market e post-chiusura USA (12:00-12:59 e 21:00-21:59 UTC) -> ogni 30 min
    - cron: '2,32 12,21 * * *'
    # Londra/Europa + funding 08:00 UTC (07:00-11:59 UTC) -> ogni 30 min
    - cron: '2,32 7-11 * * *'
    # Chiusura candela giornaliera + funding 00:00 UTC (00:00-00:59 UTC) -> ogni 30 min
    - cron: '2,32 0 * * *'
    # Bassa liquidità: notte USA e Asia (22:00, 02:00, 04:00, 06:00 UTC) -> ogni 2 ore
    - cron: '7 22,2,4,6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Evita run sovrapposti e conflitti sul commit di bot_state.json
concurrency:
  group: pionex-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Pionex AI Fast-Scalp Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN || secrets.TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.TELEGRAM_CHAT }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY || secrets.API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET || secrets.API_SECRET }}
        run: python main.py

      - name: Save Bot State & Live Console (Auto-Commit)
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bot_state.json index.html
          git diff --staged --quiet || (git commit -m "chore: update fast-scalp state and live console" && git pull --rebase -X theirs origin ${{ github.ref_name }} && git push)
